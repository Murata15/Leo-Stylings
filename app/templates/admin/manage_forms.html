{% extends 'base.html' %}
{% block title %}Manage Forms{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Manage Downloadable Forms</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit" class="btn">Upload Form</button>
    </form>

    <hr>

    <h3>Existing Forms</h3>
    {% if files %}
    <ul>
        {% for file in files %}
        <li>
            {{ file }}
            <form method="POST" action="{{ url_for('file_routes.delete_file', filename=file) }}" style="display:inline;">
                <button type="submit" onclick="return confirm('Delete this file?')" class="btn btn-danger">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No forms uploaded yet.</p>
    {% endif %}
</div>
{% endblock %}
